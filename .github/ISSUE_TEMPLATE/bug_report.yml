name: Bug report
description: Report a reproducible interface or behaviour problem.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the visible problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Choose ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: scenario
    attributes:
      label: Scenario URL
      description: Paste a shareable LUNA—VIEW URL if available.
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: "Windows 11 / Chrome / 1440 × 900"
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or console output
      description: Attach only information relevant to the defect. Remove personal data and secrets.
